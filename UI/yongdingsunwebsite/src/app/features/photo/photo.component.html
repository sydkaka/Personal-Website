<div class="container">
    <h1 class="mt-3">Photos of My Dog Chi</h1>
    <ng-container *ngIf="images$ | async as images">
        <div *ngFor="let image of images" class="image-item">
            <img [src]="image.url" [alt]="image.title" class="image">

            <!-- Likes and Heart Icon -->
            <div class="likes">
                <i class="fas fa-heart heart-icon" (click)="toggleLike(image)"></i>
                <span class="like-count">{{ image.likes }} Likes</span>
            </div>
        </div>
    </ng-container>
</div>
